# KindCaddy CI (manualplugs.md §9, PRODUCTION-PLAN.md Phase 1.1).
#
# Runs against the app in `frontend/` at this repo root. The Hermes agent
# is a separate upstream repo (NousResearch/hermes-agent) with its own CI —
# clone it via scripts/ec2-setup.sh when self-hosting.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kindcaddy
          POSTGRES_PASSWORD: kindcaddy_dev
          POSTGRES_DB: kindcaddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kindcaddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kindcaddy:kindcaddy_dev@localhost:5432/kindcaddy_test
      DATABASE_URL_TEST: postgresql://kindcaddy:kindcaddy_dev@localhost:5432/kindcaddy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Deploys are self-host (single EC2 + Docker Compose) — see
  # docker-compose.yml and scripts/ec2-setup.sh at this repo root, and the
  # manual checklist in manualplugs.md §9. Migration deploys MUST run before
  # the new app version starts:
  #   docker compose run --rm app npx prisma migrate deploy
