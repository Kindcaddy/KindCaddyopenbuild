# Secret scanning with gitleaks.
#
# Runs against every PR and on push to main. We invoke the gitleaks CLI
# directly (not the gitleaks-action wrapper) because the wrapper builds a
# `<before>^..<after>` range from the push event payload — and on the very
# first push to a new repo, `before` is the null SHA, which produces an
# invalid revision range and a confusing "ambiguous argument" failure.
#
# Scanning full history every time is safe: this repo is small, gitleaks is
# fast, and a full scan catches secrets in older commits that a diff-only
# scan would miss.

name: Secret scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history; gitleaks needs all commits to scan

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --redact --verbose --no-banner --exit-code=2
