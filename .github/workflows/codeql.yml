# Static analysis with GitHub CodeQL.
#
# Why two triggers:
#   - push to main:  catches issues introduced after merge, populates the
#                    Security tab with the canonical baseline.
#   - pull_request:  blocks new issues before merge.
#   - schedule:      weekly re-scan catches new rules that match existing
#                    code (the rule database evolves faster than the code).
#
# We scan TypeScript/JavaScript only — the only language in this repo. If
# the Hermes-agent Python service ever moves into this repo, add 'python'
# to the matrix.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # Mondays at 04:23 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is the broader pack; security-extended is
          # the deeper-but-noisier security-only pack. We pick extended on
          # purpose: false positives are cheaper than missed vulns here.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
