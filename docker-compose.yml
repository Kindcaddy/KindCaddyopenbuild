services:
  # Postgres is NOT part of the production stack. It runs on managed AWS RDS,
  # provisioned by scripts/provision-rds.sh and reached via DATABASE_URL
  # (postgresql://...@<rds-endpoint>:5432/kindcaddy?sslmode=require) set in
  # ./frontend/.env.production. RDS handles backups, patching, and Multi-AZ
  # failover, so there is no db container to run or back up here.
  #
  # For local development, start a throwaway Postgres with:
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
  #
  # Hermes was retired: the app now calls an OpenAI-compatible provider
  # (OpenRouter) directly. Configure OPENAI_* in ./frontend/.env.production.

  app:
    build: ./frontend
    restart: unless-stopped
    env_file: ./frontend/.env.production
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
